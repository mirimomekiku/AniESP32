[platformio]
default_envs = cyd2usb

[env]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
	bodmer/TFT_eSPI@^2.5.33
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
board_build.partitions = partitions.csv   ; 3.9 MB app slot, no OTA, see partitions.csv
build_flags =
	-DUSER_SETUP_LOADED
	-DUSE_HSPI_PORT
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
	-DSPI_FREQUENCY=27000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DLOAD_GLCD
	-DLOAD_FONT2
	-DLOAD_FONT4
	-DLOAD_FONT6
	-DLOAD_FONT7
	-DLOAD_FONT8
	-DLOAD_GFXFF

[env:cyd]
build_flags =
	${env.build_flags}
	-DILI9341_2_DRIVER

; Same board, but the pet's life cycle runs 60x faster for testing
[env:cyd-fast]
build_flags =
	${env.build_flags}
	-DST7789_DRIVER
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_INVERSION_OFF
	-DCYD_NO_INVERT
	-DCOLOR_GAMMA=1.0f
	-DDEBUG_FAST

; The ST7789 board (micro USB + USB-C): this is the one in use, see cyd.md in the CYD repo.
; The `cyd` env above is the original ILI9341 board, which needs the invertDisplay/gamma workarounds.
[env:cyd2usb]
build_flags =
	${env.build_flags}
	-DST7789_DRIVER
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_INVERSION_OFF
	-DCYD_NO_INVERT
	-DCOLOR_GAMMA=1.0f
